apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: st-app
  namespace: argocd
spec:
  project: st-project
  source:
    repoURL: https://github.com/sahu04/agaro_cd.git
    targetRevision: master
    path: apps/st
  destination:
    server: https://kubernetes.default.svc
    namespace: st
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
